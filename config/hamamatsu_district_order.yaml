# hamamatsu_district_order.yaml
# 浜松市の「地域(region_key) -> 地区(district)」の並び順（共通設定）
# - この順序は、自治会だけでなく人口統計など他用途でも使う前提です。
# - district 名はデータ（CSV等）の district 列と完全一致させてください。
# - YAMLに書いていない地区は末尾に自動追加されます（警告ログに出ます）。
# - YAMLに書いたのにデータ側に存在しない地区も警告ログに出ます。

version: 1
updated_at: "2026-01-03"

filename:
  pad: 2      # 01,02,... のゼロ埋め桁数
  sep: "_"    # 番号と本体の区切り（例: 01_）

order_by_region:
  kita:
    - 三ヶ日地区
    - 引佐地区
    - 細江地区
    - 都田地区
    - 新都田地区
  higashi:
    - 中ノ町地区
    - 和田地区
    - 積志地区
    - 笠井地区
    - 蒲地区
    - 長上地区
  nishi:
    - 伊佐見地区
    - 入野地区
    - 和地地区
    - 庄内地区
    - 神久呂地区
    - 篠原地区
    - 舞阪地区
    - 雄踏地区
  minami:
    - 五島地区
    - 可美地区
    - 新津地区
    - 河輪地区
    - 白脇地区
    - 芳川地区
    - 飯田地区
  naka:
    - アクト地区
    - 三方原地区
    - 中央地区
    - 佐鳴台地区
    - 北地区
    - 城北地区
    - 富塚地区
    - 曳馬地区
    - 江東地区
    - 江西地区
    - 県居地区
    - 萩丘地区
    - 西地区
    - 駅南地区
  hamakita:
    - 麁玉地区
    - 赤佐地区
    - 中瀬地区 
